server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: fitlog-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/fitlog_db}
    username: ${DB_USER:fitlog_app}
    password: ${DB_PASSWORD:sapassword}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
fitlog:
  storage-dir: ${STORAGE_DIR:./private-uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:8082,http://localhost:19006}
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
    ollama-embed-url: ${OLLAMA_EMBED_URL:http://localhost:11434/api/embed}
    embedding-model: ${EMBEDDING_MODEL:bge-m3}
    # BGE-M3 vectors are stored in MariaDB VECTOR(1024), not Qdrant.
    min-vector-similarity: ${AI_MIN_VECTOR_SIMILARITY:0.45}
