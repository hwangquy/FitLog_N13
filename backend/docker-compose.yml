services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${FITLOG_ROOT_PASSWORD:?Set FITLOG_ROOT_PASSWORD in .env.compose}
      MARIADB_DATABASE: fitlog_db
      MARIADB_USER: fitlog_app
      MARIADB_PASSWORD: ${FITLOG_DB_PASSWORD:?Set FITLOG_DB_PASSWORD in .env.compose}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - fitlog_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      retries: 10
      timeout: 5s
volumes:
  fitlog_mariadb_data:
